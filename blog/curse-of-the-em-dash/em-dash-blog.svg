<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#1c1a17"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grain)" opacity="0.03"/>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <!-- Subtle warm gradient -->
  <radialGradient id="glow" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#b8967a" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#1c1a17" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Large em dash -->
  <text x="600" y="360" font-family="Georgia, serif" font-size="320" font-weight="300" fill="#faf8f5" text-anchor="middle" dominant-baseline="middle" opacity="0.95">—</text>
  <!-- Eyebrow -->
  <text x="600" y="180" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="5" fill="#b8967a" text-anchor="middle" text-transform="uppercase">HAYLO · LOCAL MARKETING</text>
  <!-- Bottom label -->
  <text x="600" y="520" font-family="Georgia, serif" font-size="18" font-weight="300" fill="#faf8f5" text-anchor="middle" opacity="0.35" letter-spacing="1">The Curse of the Em Dash</text>
</svg>
