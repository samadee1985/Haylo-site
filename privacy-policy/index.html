<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }

  :root {
    --stone:       #f5f2ee;
    --stone-mid:   #ede9e3;
    --ink:         #1c1a17;
    --ink-soft:    #3d3a35;
    --ink-muted:   #7a766f;
    --clay:        #b8967a;
    --clay-light:  #e8d5c4;
    --warm-white:  #faf8f5;
    --border:      #e0dbd3;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body:    'DM Sans', system-ui, sans-serif;
    --max-width:   1280px;
    --gutter:      clamp(1.25rem, 4vw, 3rem);
  }

  html { scroll-behavior: smooth;
    overflow-x: clip; }

  body {
    background: var(--stone);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.7;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  a { text-decoration: none; color: inherit; }
  img { display: block; max-width: 100%; }

  /* ─── HEADER ─── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(245,242,238,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 4rem;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  .wordmark {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 2.25rem;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    text-decoration: none;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--ink); }

  .btn-header {
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    padding: 0.5rem 1.25rem;
    text-decoration: none;
    transition: background 0.2s, color 0.2s;
    display: inline-block;
  }

  .btn-header:hover { background: var(--ink); color: var(--warm-white); }

  .nav-burger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 40px;
    height: 40px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 6px;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-burger span {
    display: block;
    width: 22px;
    height: 1.5px;
    background: var(--ink);
    transition: transform 0.3s, opacity 0.3s;
  }

  .nav-burger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .nav-burger.open span:nth-child(2) { opacity: 0; }
  .nav-burger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  .nav-drawer {
    display: none;
    position: fixed;
    top: 4rem; left: 0; right: 0; bottom: 0;
    background: rgba(245,242,238,0.98);
    padding: 2rem var(--gutter);
    z-index: 99;
    overflow-y: auto;
    transform: translateY(-8px);
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    pointer-events: none;
  }

  .nav-drawer.open { transform: translateY(0); opacity: 1; pointer-events: all; }
  .nav-drawer ul { list-style: none; display: flex; flex-direction: column; }

  .nav-drawer a {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 300;
    color: var(--ink);
    display: block;
    padding: 1rem 0;
    border-bottom: 1px solid var(--border);
    transition: color 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-drawer a:hover { color: var(--clay); }

  .drawer-cta {
    display: block;
    margin-top: 2rem;
    font-family: var(--font-body);
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--warm-white);
    background: var(--ink);
    padding: 1rem 2rem;
    text-align: center;
    text-decoration: none;
    transition: background 0.2s;
  }

  .drawer-cta:hover { background: var(--ink-soft); color: var(--warm-white); }

  @media (max-width: 860px) {
    .nav-links { display: none; }
    .btn-header { display: none; }
    .nav-burger { display: flex; }
    .nav-drawer { display: block; }
  }

  /* ─── PAGE HERO BAND ─── */
  .page-band {
    background: var(--ink);
    padding: 5rem var(--gutter) 4rem;
  }

  .page-band-inner {
    max-width: var(--max-width);
    margin: 0 auto;
  }

  .page-crumb {
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(250,248,245,0.3);
    margin-bottom: 1.5rem;
  }

  .page-crumb a { color: rgba(250,248,245,0.45); transition: color 0.2s; }
  .page-crumb a:hover { color: var(--clay-light); }

  .page-h1 {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 5vw, 5rem);
    font-weight: 300;
    line-height: 1.05;
    color: var(--warm-white);
    margin-bottom: 1rem;
  }

  .page-sub {
    font-size: 0.82rem;
    color: rgba(250,248,245,0.32);
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  /* ─── PROSE ─── */
  .prose-section {
    padding: 5rem var(--gutter);
    background: var(--stone);
  }

  .prose-wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .prose-wrap h2 {
    font-family: var(--font-display);
    font-size: 1.75rem;
    font-weight: 400;
    color: var(--ink);
    margin: 3rem 0 0.75rem;
    line-height: 1.2;
  }

  .prose-wrap h2:first-child { margin-top: 0; }

  .prose-wrap p {
    font-size: 0.95rem;
    line-height: 1.9;
    color: var(--ink-soft);
    font-weight: 300;
    margin-bottom: 1rem;
  }

  .prose-wrap a {
    color: var(--clay);
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .prose-wrap a:hover { color: var(--ink); }

  /* ─── FOOTER ─── */
  footer { background: var(--ink); border-top: 1px solid rgba(250,248,245,0.06); }
  .footer-inner { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--gutter); }

  .footer-top {
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr 1fr;
    gap: 3rem;
    padding: 4rem 0 3rem;
    border-bottom: 1px solid rgba(250,248,245,0.06);
  }

  .footer-wordmark {
    font-family: var(--font-display);
    font-size: 1.8rem;
    font-weight: 300;
    color: var(--warm-white);
    margin-bottom: 1rem;
    display: block;
    text-decoration: none;
  }

  .footer-tagline {
    font-size: 0.82rem;
    line-height: 1.75;
    color: rgba(250,248,245,0.28);
    max-width: 220px;
    font-weight: 300;
  }

  .footer-col-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(250,248,245,0.28);
    display: block;
    margin-bottom: 1.25rem;
  }

  .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.7rem; }

  .footer-col ul a {
    font-size: 0.82rem;
    font-weight: 300;
    color: rgba(250,248,245,0.38);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer-col ul a:hover { color: rgba(250,248,245,0.78); }

  .footer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    padding: 1.5rem 0;
  }

  .footer-copy { font-size: 0.72rem; color: rgba(250,248,245,0.18); font-weight: 300; }
  .footer-contact { display: flex; gap: 1.5rem; }

  .footer-contact a {
    font-size: 0.72rem;
    color: rgba(250,248,245,0.28);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer-contact a:hover { color: rgba(250,248,245,0.65); }


  /* ─── WHATSAPP BUTTON ─── */
  .wa-btn {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    z-index: 199;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .wa-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 22px rgba(0,0,0,0.22);
  }
  .wa-btn svg { display: block; }
  @media (max-width: 767px) {
    .wa-btn { bottom: 1.25rem; right: 1rem; width: 46px; height: 46px; }
  }
</style>
